version: '3.8'

services:
    mongodb:
        image: mongo:7
        container_name: flashcard-mongodb
        volumes:
            - mongodb_data:/data/db
        networks:
            - web
        environment:
            - MONGO_INITDB_ROOT_USERNAME=admin
            - MONGO_INITDB_ROOT_PASSWORD=password

    backend:
        build: .
        container_name: flashcard-backend
        ports:
            - "5000:5000"
        environment:
            - MONGO_HOST=mongodb
            - MONGO_PORT=27017
            - MONGO_DATABASE=flashcards
            - MONGO_USERNAME=admin
            - MONGO_PASSWORD=password
            # Sessions are signed with this; set it in .env (openssl rand -base64 48).
            - JWT_SECRET=${JWT_SECRET:-}
            - APP_URL=${APP_URL:-http://localhost:3000}
            - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
            - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
            - MAILGUN_API_BASE=${MAILGUN_API_BASE:-https://api.mailgun.net}
        depends_on:
            - mongodb
        networks:
            - web
        volumes:
            - ./:/app

    frontend:
        build:
            context: ../flashcard-frontend
        container_name: flashcard-frontend
        ports:
            - "3000:80"
        depends_on:
            - backend
        networks:
            - web

volumes:
    mongodb_data:


networks:
    web:
        external: true
