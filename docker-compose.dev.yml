version: '3.8'

services:
    mongodb:
        image: mongo:7
        container_name: flashcard-mongodb
        volumes:
            - mongodb_data:/data/db
        networks:
            - web
        environment:
            - MONGO_INITDB_ROOT_USERNAME=admin
            - MONGO_INITDB_ROOT_PASSWORD=password

    backend:
        build: .
        container_name: flashcard-backend
        ports:
            - "5000:5000"
        environment:
            - MONGO_HOST=mongodb
            - MONGO_PORT=27017
            - MONGO_DATABASE=flashcards
            - MONGO_USERNAME=admin
            - MONGO_PASSWORD=password
            # Real local accounts in dev too. With no MAILGUN_*/SMTP_* set,
            # verification and reset emails are printed to this container's
            # log instead of sent: `docker logs flashcard-backend` for the link.
            # JWT_SECRET unset means a random key per start (sessions end on
            # restart), which is fine locally.
            - APP_URL=${APP_URL:-http://localhost:3001}
            # Optional "Continue with Google" locally. The Google OAuth client
            # needs http://localhost:3010/api/auth/google/callback (the port
            # docker-compose.local.yml publishes) as an authorised redirect URI.
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
            - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
            # Still honoured for scripts like share-scenarios.sh that name a
            # user with X-Dev-User; refused outright when FLASK_ENV says
            # production. It must never be set on the server.
            - RECALLCARDS_DEV_AUTH=true
            # AI deck generation (/api/generate-cards). Export ANTHROPIC_API_KEY
            # in your shell before `docker compose up` to try it locally; left
            # unset, the feature just reports it isn't configured.
            - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
        depends_on:
            - mongodb
        networks:
            - web
        volumes:
            - ./:/app

    frontend:
        build:
            context: ../flashcard-frontend
            dockerfile: Dockerfile.dev
        container_name: flashcard-frontend-dev
        ports:
            - "3001:3001"
        environment:
            # A bind mount from macOS delivers no filesystem events into the
            # container, so Tailwind never re-scans an edited file and classes
            # added since the server started are simply never generated -- the
            # markup is right and the styles are missing. Vite already polls;
            # this is the same switch for every chokidar-based watcher behind
            # it, Tailwind's content scanning included.
            - CHOKIDAR_USEPOLLING=true
            - CHOKIDAR_INTERVAL=300
        depends_on:
            - backend
        networks:
            - web
        volumes:
            - ../flashcard-frontend:/app
            - /app/node_modules
        stdin_open: true
        tty: true

volumes:
    mongodb_data:


networks:
    web:
        external: true
