# RecallCards on the shared gateway box (app #4), per my-simple-resume/SERVER-HANDOFF.md.
#
# Deliberately different from docker-compose.yml (the friend's-box layout):
#   - no published host ports: the gateway reaches recallcards-frontend by name
#     over recallcards-net, the same way it reaches the other three apps
#   - its own network and its own MongoDB, shared with nothing
#   - container names prefixed recallcards- so they cannot collide with the
#     stale flashcard-* containers that may still exist on that box
#
# The gateway terminates TLS and proxies recallcards.net -> recallcards-frontend:80.
# That frontend nginx serves the SPA and proxies /api/ to the backend, so the
# gateway only needs one upstream.

services:
  mongodb:
    image: mongo:7
    container_name: recallcards-mongodb
    restart: always
    # No ports: reachable only from inside recallcards-net. Nothing on the host
    # or the internet can touch it.
    volumes:
      - recallcards_mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    networks:
      - recallcards-net

  backend:
    build: .
    container_name: recallcards-backend
    restart: always
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=${MONGO_DATABASE:-flashcards}
      - MONGO_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      # Local accounts (accounts.py). JWT_SECRET signs every session token: a
      # long random string, kept only in .env on the box. The API refuses to
      # start in production without it. Changing it signs everyone out.
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      # Where the links in verification and reset emails point.
      - APP_URL=${APP_URL:-https://recallcards.net}
      # Account email through Mailgun's HTTP API. Use MAILGUN_API_BASE=
      # https://api.eu.mailgun.net for a domain in Mailgun's EU region.
      # (Alternatively set SMTP_HOST/SMTP_PORT/SMTP_USERNAME/SMTP_PASSWORD for
      # Mailgun's SMTP relay, smtp.mailgun.org:587.)
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:?set MAILGUN_API_KEY in .env}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:?set MAILGUN_DOMAIN in .env}
      - MAILGUN_API_BASE=${MAILGUN_API_BASE:-https://api.mailgun.net}
      - MAIL_FROM=${MAIL_FROM:-RecallCards <no-reply@recallcards.net>}
      # Production. This alone makes the dev-auth bypass refuse to run even if
      # the next line were ever added by mistake.
      - FLASK_ENV=production
      # RECALLCARDS_DEV_AUTH is deliberately ABSENT. Setting it here reopens the
      # authentication hole the app was just fixed for. Never add it on a server.
      # AI deck generation (/api/generate-cards). Set ANTHROPIC_API_KEY in .env
      # on the box; without it the feature returns a clear "not configured"
      # message and the rest of the app is unaffected.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - mongodb
    networks:
      - recallcards-net

  frontend:
    build:
      context: ../flashcard-frontend
      dockerfile: Dockerfile
    container_name: recallcards-frontend
    restart: always
    # No ports here either. The gateway proxies to recallcards-frontend:80 over
    # the network; nginx inside this image already listens on 80 and carries the
    # 6M client_max_body_size so card-picture uploads are not capped at 1MB.
    depends_on:
      - backend
    networks:
      - recallcards-net

  # The MCP connector for Claude. Its own Python 3.11 image, like the backend.
  # It calls the REST API over the network for all card data and touches Mongo
  # only for its own OAuth tokens. The gateway proxies /mcp and /connector/* here.
  connector:
    build:
      context: .
      dockerfile: Dockerfile.connector
    container_name: recallcards-connector
    restart: always
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=${MONGO_DATABASE:-flashcards}
      - MONGO_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_PASSWORD=${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      # Users sign in with their RecallCards account on /connector/login; the
      # connector passes the password to the API and keeps only its tokens.
      # Public identity + where the API lives on the network.
      - CONNECTOR_PUBLIC_URL=https://recallcards.net
      - CONNECTOR_SITE_URL=https://recallcards.net
      - CONNECTOR_ALLOWED_HOSTS=recallcards.net,www.recallcards.net
      - CONNECTOR_API_URL=http://recallcards-backend:5000
    depends_on:
      - backend
      - mongodb
    networks:
      - recallcards-net

volumes:
  recallcards_mongo_data:

networks:
  recallcards-net:
    external: true
    name: recallcards-net
