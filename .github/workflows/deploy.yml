name: Deploy Backend

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# RecallCards runs as app #4 on the shared gateway box (37.27.31.223), beside
# 123resume, jsonsanitypro and spec-review. See my-simple-resume/SERVER-HANDOFF.md.
# This deploy touches ONLY the recallcards-backend container: never the gateway,
# never another project's containers, networks or volumes.

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 37.27.31.223
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            APP=/root/recallcards/flashcard-backend
            cd "$APP"

            # Match the repo exactly. Never `git clean`: it would delete the
            # untracked .env that holds the Mongo password and Auth0 config.
            git fetch origin
            git reset --hard origin/main || git reset --hard origin/master

            # The app network should already exist; create it if somehow gone.
            docker network inspect recallcards-net >/dev/null 2>&1 || docker network create recallcards-net

            # Rebuild and restart ONLY the backend. --no-deps leaves the running
            # MongoDB (and its data) and the frontend untouched.
            docker compose -f docker-compose.prod.yml up -d --build --no-deps backend

            # The backend's container IP changes on recreate, and the frontend's
            # nginx caches it. Reload the frontend so /api/ re-resolves the new IP.
            # (Our own container; the shared gateway re-resolves on its own.)
            docker exec recallcards-frontend nginx -s reload 2>/dev/null || true

            # Health gate: a crash on startup (bad import, lost Mongo) exits the
            # container, so "still running after a moment" is the signal.
            sleep 8
            docker compose -f docker-compose.prod.yml ps backend
            if [ "$(docker inspect -f '{{.State.Running}}' recallcards-backend)" != "true" ]; then
              echo "::error::recallcards-backend is not running after deploy"
              docker logs --tail 50 recallcards-backend || true
              exit 1
            fi
            docker logs --tail 15 recallcards-backend || true

            # Best-effort end-to-end check through the gateway (non-fatal: the
            # container-running gate above is the hard one).
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 8 https://recallcards.net/api/public/decks || true)
            echo "api /api/public/decks -> ${code:-no-response}"

            # The MCP connector lives in this repo too; rebuild and restart it.
            # Its own container, on the same network; the gateway re-resolves it.
            docker compose -f docker-compose.prod.yml up -d --build --no-deps connector
            sleep 5
            if [ "$(docker inspect -f '{{.State.Running}}' recallcards-connector)" != "true" ]; then
              echo "::error::recallcards-connector is not running after deploy"
              docker logs --tail 50 recallcards-connector || true
              exit 1
            fi

            # Reclaim only this project's dangling images.
            docker image prune -f \
              --filter "label=com.docker.compose.project=flashcard-backend" \
              --filter "until=24h" || true

            echo "Backend deploy OK"
